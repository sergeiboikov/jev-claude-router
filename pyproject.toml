[project]
name = "jev-claude-router"
version = "0.1.0"
description = "MCP server where Jev recommends which Claude model to use for a task"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "model-router-python>=0.2",
]

[project.scripts]
jev-claude-router = "jev_claude_router.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_claude_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
